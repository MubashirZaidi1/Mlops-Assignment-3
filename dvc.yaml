stages:
  fetch_data:
    cmd: bash -c '"/home/mubashir/Desktop/Assignment 3/weather_pipeline/venv/bin/python3.10" scripts/fetch_data.py'
    deps:
      - scripts/fetch_data.py
    outs:
      - data/raw_data.csv

  preprocess_data:
    cmd: bash -c '"/home/mubashir/Desktop/Assignment 3/weather_pipeline/venv/bin/python3.10" scripts/preprocess_data.py'
